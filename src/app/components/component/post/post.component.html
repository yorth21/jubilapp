<div class="bg-gray-100 p-4 rounded-lg shadow">
  <input
    type="text"
    [(ngModel)]="title"
    placeholder="Título"
    class="w-full p-2 border rounded mb-2 text-[var(--text-color)]"
  />

  <textarea
    [(ngModel)]="content"
    placeholder="Mensaje"
    class="w-full p-2 border rounded mb-2 text-[var(--text-color)]"
  ></textarea>

  <button
    (click)="crearPost()"
    class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600"
  >
    Publicar
  </button>
</div>
