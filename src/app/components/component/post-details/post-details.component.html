<div *ngIf="post" class="bg-white p-4 shadow rounded-lg border">
  <div class="bg-[var(--text2-color)] p-4 rounded-lg">
    <h2 class="text-xl font-semibold text-[var(--primary-color)]">
      {{ post.title }}
    </h2>
    <p class="text-white">{{ post.content }}</p>
  </div>

  <div class="flex justify-end mt-2">
    <button
      class="px-2 py-1 bg-red-500 text-white font-bold rounded-lg shadow-lg hover:bg-red-600 transition"
    >
      🗑️
    </button>
  </div>

  <div class="mt-4">
    <h3 class="text-lg font-semibold">Add a comment:</h3>
    <textarea
      [(ngModel)]="newComment"
      class="w-full p-2 border rounded-md text-black"
      rows="3"
      placeholder="Write your comment..."
    ></textarea>
    <button
      (click)="addComments()"
      class="mt-2 px-4 py-2 bg-blue-500 text-white font-bold rounded-lg shadow-lg hover:bg-blue-600 transition"
    >
      ➕ Add Comment
    </button>
  </div>
  s

  <div class="mt-4">
    <h3 class="text-lg font-bold">Comentarios:</h3>
    <div *ngIf="comments.length > 0; else noComments">
      <div
        *ngFor="let comment of comments"
        class="bg-gray-100 p-3 mt-2 rounded-lg"
      >
        <p class="text-gray-800">
          <strong>{{ comment.userNames }}:</strong> {{ comment.content }}
        </p>
        <small class="text-gray-600">{{
          comment.createdAt | date : "short"
        }}</small>
      </div>
    </div>
    <ng-template #noComments>
      <p class="text-gray-500">No hay comentarios aún.</p>
    </ng-template>
  </div>
</div>
