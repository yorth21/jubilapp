<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div class="grid grid-cols-2 gap-2 h-64">
    <label class="block text-center">
      <span class="text-[var(--text-color)] font-semibold font-serif"
        >NOMBRE</span
      >
      <input
        type="text"
        formControlName="nombre"
        class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-300 outline-none"
      />
    </label>

    <label class="block text-center">
      <span class="text-[var(--text-color)] font-semibold font-serif"
        >CÉDULA</span
      >
      <input
        type="text"
        formControlName="cedula"
        class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-300 outline-none"
      />
    </label>

    <label class="block text-center">
      <span class="text-[var(--text-color)] font-semibold font-serif"
        >CONTRASEÑA</span
      >
      <input
        type="password"
        formControlName="contraseña"
        class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-300 outline-none"
      />
    </label>

    <label class="block text-center">
      <span class="text-[var(--text-color)] font-semibold font-serif"
        >DIRECCIÓN</span
      >
      <input
        type="text"
        formControlName="direccion"
        class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-300 outline-none"
      />
    </label>

    <label class="block text-center">
      <span class="text-[var(--text-color)] font-semibold font-serif"
        >EDAD</span
      >
      <input
        type="number"
        formControlName="edad"
        class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-300 outline-none"
      />
    </label>
  </div>

  <div class="flex flex-col items-center mt-4">
    <app-button-registre></app-button-registre>
  </div>
</form>
