<form class="rounded-lg p-6 w-full space-y-4 text-center bg-transparent">
  <label class="text-center flex flex-col justify-between items-center w-full">
    <span class="text-[var(--text-color)] font-semibold font-serif text-lg"
      >CEDULA</span
    >
    <input
      type="text"
      [(ngModel)]="cedula"
      class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-300 outline-none"
      name="cedula"
    />
  </label>

  <label class="text-center flex flex-col w-full justify-between items-center">
    <span class="text-[var(--text-color)] font-semibold font-serif text-lg"
      >CONTRASEÑA</span
    >
    <input
      type="password"
      [(ngModel)]="password"
      class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring focus:ring-blue-300 outline-none"
      name="password"
    />
  </label>

  <button type="button" (click)="enviarDatos()" hidden></button>
</form>
