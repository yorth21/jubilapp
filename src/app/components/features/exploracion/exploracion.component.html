<div class="fixed w-full top-0 left-0 shadow-md z-50">
  <app-header></app-header>
</div>
<div class="bg-[var(--primary-color)] flex flex-col mt-28">
  <div
    *ngFor="let activity of activites()"
    class="p-4 bg-[var(--primary-color)] rounded-lg m-2 transition min-w-32 flex flex-col items-center"
    (click)="goToModule(activity.route)"
  >
    <h2
      class="text-center font-bold mt-2 font-serif text-[var(--second-color)] text-3xl"
    >
      {{ activity.name }}
    </h2>
    <img
      [src]="activity.img"
      alt="Modulo"
      class="w-full h-32 object-cover rounded-lg"
    />
    <ul>
      <a class="hover:underline" href="">VER MAS</a>
    </ul>
  </div>
</div>
