<div class="text-center flex justify-center">
  <div class="w-1/3">
    <app-button-exit routerPath="/"></app-button-exit>
  </div>

  <div class="w-2/3 text-start">
    <h1 class="text-5xl font-bold mb-4 ml-16">Seccion Foros</h1>
    <p class="text-xl mb-10 pl-28 text-start">Conecta con mas usuarios.</p>
  </div>
</div>
<div class="flex justify-center gap-6 flex-wrap">
  <app-modulo-only
    *ngFor="let card of cards"
    [title]="card.title"
    [description]="card.description"
    [icon]="card.icon"
    [link]="card.link"
  ></app-modulo-only>
</div>
