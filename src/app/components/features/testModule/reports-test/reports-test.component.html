<div
  *ngIf="results"
  class="max-w-3xl mx-auto p-6 bg-white shadow-lg rounded-lg"
>
  <h2 class="text-center text-2xl font-bold text-gray-800 mb-6">
    📊 Resultados del Test Vocacional
  </h2>

  <div
    class="bg-[var(--text-color)] text-white p-4 rounded-lg text-center shadow-md"
  >
    <h3 class="text-xl font-semibold">Categoría Dominante</h3>
    <p class="text-lg font-bold">{{ results?.dominantCategory.name }}</p>
    <p class="text-sm font-light">
      Código: {{ results?.dominantCategory.code }}
    </p>
  </div>

  <div class="mt-6">
    <h3 class="text-lg font-semibold text-gray-700">
      📈 Puntuaciones por Área
    </h3>
    <ul class="mt-4 space-y-4">
      <li *ngFor="let score of results.scores">
        <div class="flex justify-between">
          <span class="font-medium text-gray-800">{{ score.name }}</span>
          <span class="text-gray-600">{{ score.score }}/10</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
          <div
            class="h-full bg-green-500 rounded-full"
            [style.width]="score.score * 10 + '%'"
          ></div>
        </div>
      </li>
    </ul>
  </div>
</div>

<p *ngIf="!results" class="text-center text-gray-500 mt-6">
  No hay resultados disponibles.
</p>
