<div class="flex justify-center gap-6 flex-wrap flex-col">
  <div class="flex">
    <div class="w-1/3">
      <app-button-exit routerPath="/vocacional"></app-button-exit>
    </div>

    <div class="text-center">
      <h1 class="text-5xl font-bold">Exploracion Laboral</h1>
      <p class="text-xl">Descubre actividades donde ser Colaborador</p>
    </div>
  </div>

  <div class="flex justify-center gap-6 flex-wrap text-white">
    <app-modulo-only
      *ngFor="let card of cards"
      [title]="card.title"
      [description]="card.description"
      [icon]="card.icon"
      [link]="card.link"
    ></app-modulo-only>
  </div>
</div>
