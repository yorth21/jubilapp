<div class="flex">
  <div class="w-1/3">
    <app-button-exit routerPath="/vocacional"></app-button-exit>
  </div>
  <div>
    <h2
      class="mb-3 text-2xl font-serif text-[var(--text-color)] text-center font-semibold"
    >
      SEGUN LA PRUEBA VOCACIONAL SE LE RECOMIENDA
    </h2>
  </div>
</div>
<div class="flex flex-col mt-16">
  <div
    *ngFor="let activity of activites()"
    class="p-4 rounded-lg m-2 transition min-w-32 flex flex-col sm:flex-row items-center justify-between bg-[var(--text-color)]"
  >
    <div class="w-full flex flex-col gap-5">
      <h2 class="text-center font-bold mt-2 font-serif text-white text-3xl">
        {{ activity.name }}
      </h2>
      <img
        [src]="activity.img"
        alt="Modulo"
        class="w-1/2 h-32 object-cover rounded-3xl sm:w-full"
      />
    </div>
    <div class="w-full flex flex-col items-center justify-end gap-2 text-white">
      <span class="text-xl">Hola {{ user.names }} Este curso es para ti.</span>
      <p
        class="descripcion text-white font-semibold text-base w-2/3 text-balance"
      >
        {{ activity.recomendaciones }}
      </p>
    </div>
  </div>
</div>
