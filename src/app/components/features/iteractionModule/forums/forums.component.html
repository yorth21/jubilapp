<div class="min-h-screen">
  <div class="flex items-center justify-between">
    <div class="w-1/3">
      <app-button-exit routerPath="/social"></app-button-exit>
    </div>
    <div><h1 class="text-2xl font-bold text-start mr-80">Posts</h1></div>

    <button
      (click)="togglePostForm()"
      class="px-2 py-2 bg-white bg-opacity-10 text-white font-bold rounded-lg shadow-lg hover:bg-slate-500 transition"
    >
      {{ mostrarPostForm ? "Ocultar" : "➕ Add Post" }}
    </button>
  </div>

  <div class="flex justify-center mt-4"></div>

  <app-post
    *ngIf="mostrarPostForm"
    (postCreado)="agregarPost($event)"
  ></app-post>

  <div class="mt-4 space-y-4">
    <div
      (click)="goToPsot(post.id)"
      *ngFor="let post of posts"
      class="bg-white p-4 shadow rounded-lg border"
    >
      <h2 class="text-xl font-semibold text-[var(--text-color)]">
        {{ post.title }}
      </h2>
      <p class="text-gray-700">{{ post.content }}</p>
    </div>
  </div>
</div>
