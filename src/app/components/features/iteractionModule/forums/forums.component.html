<div class="min-h-screen">
  <h1 class="text-2xl font-bold text-center mt-4">Foro</h1>

  <app-post (postCreado)="agregarPost($event)"></app-post>

  <div class="mt-4 space-y-4">
    <div
      *ngFor="let post of posts"
      class="bg-white p-4 shadow rounded-lg border"
    >
      <h2 class="text-xl font-semibold text-[var(--text-color)]">
        {{ post.title }}
      </h2>
      <p class="text-gray-700">{{ post.content }}</p>
    </div>
  </div>
</div>
