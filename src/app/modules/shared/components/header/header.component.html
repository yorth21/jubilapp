<header
  class="flex justify-between items-center px-6 py-2 bg-[var(--background2-color)] border-b-2 border-gray-500"
>
  <button *ngIf="isaAuthenticated" (click)="logout()" class="logout-btn">
    Cerrar sesión
  </button>
  <div class="w-14">
    <app-icon-jubil></app-icon-jubil>
  </div>
  <div class="flex flex-col items-center font-bold">
    <h1 class="text-center pb-4 text-xl text-[var(--second-color)]">
      {{ titulo }}
    </h1>
    <nav class="text-[var(--primary-color)]">
      <ul class="flex space-x-6">
        <!-- <li><a href="/modules" class="hover:text-gray-400">Inicio</a></li> -->
        <li><a href="/modules" class="hover:text-gray-400">Módulos</a></li>
        <li>
          <a href="/citas" class="hover:text-gray-400">Psicologico</a>
        </li>
        <li><a href="#" class="hover:text-gray-400">Contacto</a></li>
      </ul>
    </nav>
  </div>

  <div class="w-16" (click)="goToPerfil()">
    <app-mi-perfil></app-mi-perfil>
  </div>
</header>
